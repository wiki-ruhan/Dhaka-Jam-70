name: Dhaka traffic collector

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: dhaka-collector
  cancel-in-progress: false

jobs:
  init:
    runs-on: ubuntu-latest
    outputs:
      done: ${{ steps.state.outputs.done }}
      shards: ${{ steps.state.outputs.shards }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Create or check data/state.json
        id: state
        run: |
          git config user.name "dhaka-traffic-bot"
          git config user.email "actions@users.noreply.github.com"
          python runner.py --plan
          python runner.py --init > init.txt
          cat init.txt
          if tail -n 1 init.txt | grep -q finished; then echo "done=true" >> "$GITHUB_OUTPUT"; else echo "done=false" >> "$GITHUB_OUTPUT"; fi
          echo "shards=$(tail -n 2 init.txt | head -n 1)" >> "$GITHUB_OUTPUT"
          git add -A data
          git commit -q -m "study state" || true
          git push -q || true

  collect:
    needs: init
    if: needs.init.outputs.done == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.init.outputs.shards) }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-dejavu-core > /dev/null || true
      - name: Take snapshots (worker ${{ matrix.shard }})
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
          DRIVE_WEBAPP_URL: ${{ secrets.DRIVE_WEBAPP_URL }}
          DRIVE_TOKEN: ${{ secrets.DRIVE_TOKEN }}
          WAQI_TOKEN: ${{ secrets.WAQI_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          git config user.name "dhaka-traffic-bot"
          git config user.email "actions@users.noreply.github.com"
          git pull -q || true
          python runner.py --shard ${{ matrix.shard }}

  handover:
    needs: [init, collect]
    if: always() && needs.init.outputs.done == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Start the next run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if grep -q '"finished": true' data/state.json 2>/dev/null; then
            echo "30 days finished. No new run."
          else
            gh workflow run collect.yml --ref "${GITHUB_REF_NAME}"
          fi
